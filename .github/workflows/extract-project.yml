name: Extract Raid Watcher Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf app
          unzip -o TGM_Raid_Watcher_COMPLETE.zip
          rm TGM_Raid_Watcher_COMPLETE.zip

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add TGM Raid Watcher Android project" || echo "Nothing to commit"
          git push
