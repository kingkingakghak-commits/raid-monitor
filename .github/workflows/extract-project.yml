name: Extract Raid Watcher Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf app
          rm -f build.gradle.kts
          rm -f settings.gradle.kts
          rm -f gradle.properties
          rm -f README.md

          unzip -o TGM_Raid_Watcher_COMPLETE.zip

          rm -f TGM_Raid_Watcher_COMPLETE.zip
          rm -f .github/workflows/build-apk.yml

      - name: Commit Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Add TGM Raid Watcher Android project" || echo "Nothing to commit"

          git push
